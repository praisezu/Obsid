# Push a version tag to publish a release (the tag message becomes the release notes):
#   npm version 0.2.1 --no-git-tag-version && git commit -am "Vanta 0.2.1"
#   git tag -a v0.2.1 -m "Vanta 0.2.1" -m "- short list of changes" && git push --follow-tags
# The release gets vanta.tar.gz (what the installer and in-app updater download) and the installers.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Optional code signing: add these two repo secrets to sign VantaInstaller.exe (see README)
      CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release description is the (short) message of the annotated tag:
      #   git tag -a v0.2.0 -m "Vanta 0.2.0" -m "- what changed"
      - name: Release notes from tag
        run: |
          git fetch --tags --force
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "Vanta ${GITHUB_REF_NAME#v}" > notes.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Check version matches tag
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "v$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json version ($PKG) doesn't match tag (${GITHUB_REF_NAME})"; exit 1
          fi

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Build Vanta
        # obsid.tar.gz: same file under Vanta's old name, so Obsid 0.2.x installs auto-update into Vanta
        run: npm run build:release && npm run package && cp release/vanta.tar.gz release/obsid.tar.gz

      - name: Build installers
        working-directory: installer
        run: |
          V=${GITHUB_REF_NAME#v}
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=$V" -o ../release/VantaInstaller.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.Version=$V" -o ../release/VantaInstaller-linux .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.Version=$V" -o ../release/VantaInstaller-macos .

      - name: Sign Windows installer
        if: env.CERT_PFX_BASE64 != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          echo "$CERT_PFX_BASE64" | base64 -d > cert.pfx
          osslsigncode sign -pkcs12 cert.pfx -pass "$CERT_PASSWORD" -n "Vanta Installer" -i "https://github.com/${GITHUB_REPOSITORY}" -t http://timestamp.digicert.com -in release/VantaInstaller.exe -out release/VantaInstaller-signed.exe
          mv release/VantaInstaller-signed.exe release/VantaInstaller.exe
          rm cert.pfx

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Vanta ${{ github.ref_name }}
          body_path: notes.md
          files: |
            release/vanta.tar.gz
            release/obsid.tar.gz
            release/VantaInstaller.exe
            release/VantaInstaller-linux
            release/VantaInstaller-macos
