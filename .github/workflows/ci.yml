name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - name: Plugin store index matches the files
        run: node scripts/store-index.mjs --check
      - run: npm run build:release && npm run package
      - name: Build installer (all platforms)
        working-directory: installer
        run: |
          GOOS=windows go build -o /dev/null .
          GOOS=linux go vet ./...
          GOOS=darwin go build -o /dev/null .
